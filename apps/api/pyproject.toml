[project]
name = "vedic-astro-api"
version = "0.1.0"
description = "Vedic astrology API: deterministic chart engine + rule/LLM interpretation"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    # Community fork of pyswisseph; same Swiss Ephemeris C library, same `import swisseph`,
    # but ships prebuilt wheels (incl. Windows), so no C compiler is needed.
    "pysweph>=2.10.3.6",
    # IANA timezone database for zoneinfo (Windows has no system copy).
    "tzdata>=2024.1",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "timezonefinder>=6.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.knowledge" = ["*.yaml", "rules/*.yaml"]
"app.llm" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
