# LLM providers. LLM_PROVIDERS in .env picks which to use and in what order; the default is
# DEFAULT_ORDER in providers.py. Entries without their key in .env are skipped.
#
# Free-tier limits change often. Measured 2026-10-03 with real keys:
#   Gemini: 20 requests per day PER MODEL on the free tier (so several Gemini models are
#           listed: each has its own daily quota). A 429 says how long until the reset.
#   Groq:   openai/gpt-oss-120b, 30 RPM, 1,000 RPD and 8,000 tokens per minute. Tokens are
#           what run out first (a reading is ~1,000 in plus the reply and reasoning).
#   OpenRouter: ":free" models, 20 RPM; 50 per day without credits. Off by default.
# Any value can be overridden in .env as <NAME>_MODEL, <NAME>_RPM, <NAME>_RPD, <NAME>_TPM.
#
# All of them speak the OpenAI chat-completions API. Only chart facts are ever sent.

gemini:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  key_env: GEMINI_API_KEY
  model: gemini-3.8-flash
  rpm: 10
  rpd: 20
  max_tokens: 1200

gemini_35:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  key_env: GEMINI_API_KEY
  model: gemini-3.5-flash
  rpm: 10
  rpd: 20
  max_tokens: 1200

groq:
  base_url: https://api.groq.com/openai/v1
  key_env: GROQ_API_KEY
  model: openai/gpt-oss-120b
  rpm: 30
  rpd: 1000
  tpm: 8000
  max_tokens: 1500  # includes the model's reasoning tokens
  extra:
    reasoning_effort: low

gemini_lite:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  key_env: GEMINI_API_KEY
  model: gemini-3.5-flash-lite
  rpm: 15
  rpd: 20
  max_tokens: 1200

gemini_lite_31:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  key_env: GEMINI_API_KEY
  model: gemini-3.1-flash-lite
  rpm: 15
  rpd: 20
  max_tokens: 1200

openrouter:
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
  model: google/gemma-4-31b-it:free
  rpm: 20
  rpd: 50
  max_tokens: 1200
  timeout_seconds: 30
  headers:
    X-Title: Vedic Astro
